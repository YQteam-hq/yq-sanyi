<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>yq-sanyi · M2 SSR + Hydrate 示例</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    .note { font-size: 13px; color: #666; margin-bottom: 16px; }
    .card { border: 1px solid #e5e7eb; border-radius: 6px; padding: 16px; }
    .card h2 { margin: 0 0 8px; font-size: 16px; }
    .card p { margin: 0; font-size: 14px; line-height: 1.5; }
    .badge { display: inline-block; font-size: 11px; background: #ecfeff; color: #0e7490; padding: 2px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <h1>yq-sanyi · SSR + Hydrate (M2)</h1>
  <div class="note">
    演示 <code>parseTemplateDSD</code> 把模板里 <code><template shadowrootmode></code> 解析出来，
    然后 <code>hydrate</code> 接管已存在的 DOM（无需重建）。
  </div>

  <div id="app">
    <yq-card>
      <template shadowrootmode="open">
        <div class="card">
          <h2>{{ title }} <span class="badge">hydrated</span></h2>
          <p>{{ body }}</p>
        </div>
      </template>
    </yq-card>
  </div>

  <script src="../packages/core/dist/core.global.js"></script>
  <script>
    yq.define('yq-card', {
      template: '<div><slot></slot></div>',
      style: '',
      script: function () {
        return {
          state: {
            title: 'Hello from yq-sanyi',
            body: 'This card was SSR-rendered and hydrated in place. No DOM was rebuilt.'
          }
        }
      }
    })

    const dsd = yq.parseTemplateDSD(document.querySelector('yq-card').innerHTML)
    console.log('parseTemplateDSD →', dsd)

    yq.hydrate('#app yq-card')

    setTimeout(() => {
      const instance = yq.lookup('yq-card')
      if (instance && instance.cdo) {
        const host = document.querySelector('yq-card')
        if (host && host._yqInstance) {
          host._yqInstance.state.title = 'Hydrated + Reactive'
        }
      }
    }, 100)
  </script>
</body>
</html>
