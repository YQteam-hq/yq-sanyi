<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>yq-sanyi · M1-1 嵌套列表示例</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 18px; margin-bottom: 16px; }
    .section { margin-bottom: 24px; }
    .section h2 { font-size: 14px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    .group { border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; }
    .group-title { font-weight: 600; margin-bottom: 6px; }
    .item { padding: 4px 0; padding-left: 16px; border-left: 2px solid #e5e7eb; margin: 4px 0; font-size: 14px; }
    .item-tag { display: inline-block; background: #f3f4f6; padding: 1px 6px; border-radius: 3px; margin-right: 6px; font-size: 12px; color: #555; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>yq-sanyi · 嵌套列表 (M1-1)</h1>
  <div class="section">
    <h2>分组</h2>
    <yq-nested-list></yq-nested-list>
  </div>

  <script src="../packages/core/dist/core.global.js"></script>
  <script>
    yq.define('yq-row', {
      template: '<div class="item"><span class="item-tag">{{ row.tag }}</span>{{ row.label }}</div>',
      style: '',
      script: function () { return {} }
    });

    yq.define('yq-nested-list', {
      template:
        '<div>' +
          '<div yq-for="group in groups" yq-key="id" class="group">' +
            '<div class="group-title">{{ group.name }} · {{ group.items.length }} 项</div>' +
            '<yq-row yq-for="row in group.items" yq-key="tag"></yq-row>' +
          '</div>' +
        '</div>',
      style: '',
      script: function () {
        return {
          state: {
            groups: [
              { id: 'g1', name: '前端', items: [
                { tag: 'js',   label: 'yq-sanyi · 0.4.0' },
                { tag: 'dom',  label: 'Declarative Shadow DOM' },
                { tag: 'a11y', label: 'aria-* 空值不渲染' }
              ]},
              { id: 'g2', name: '生态', items: [
                { tag: 'react', label: 'React 19 包装器（≤1kB）' },
                { tag: 'vue',   label: 'Vue 3 包装器（≤1kB）' }
              ]},
              { id: 'g3', name: '内部', items: [
                { tag: 'M1-1', label: '嵌套 yq-for 已解锁' },
                { tag: 'M2-1', label: 'parseTemplateDSD 可用' }
              ]}
            ]
          }
        }
      }
    })
  </script>
</body>
</html>
